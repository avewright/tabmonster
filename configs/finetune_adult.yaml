experiment_name: finetune_adult_like
seed: 42
task:
  mode: finetune
  problem_type: binary
  target_column: target
data:
  dataset_type: csv
  train_path: data/adult_train.csv
  val_path: data/adult_val.csv
  numeric_columns:
    - age
    - fnlwgt
    - education_num
    - capital_gain
    - capital_loss
    - hours_per_week
  categorical_columns:
    - workclass
    - education
    - marital_status
    - occupation
    - relationship
    - race
    - sex
    - native_country
  train_size: 0
  val_size: 0
  batch_size: 256
  num_workers: 0
  standardize_numeric: true
model:
  d_model: 192
  n_heads: 6
  n_layers: 6
  d_ff: 384
  dropout: 0.1
  max_categories: 128
training:
  device: cpu
  max_epochs: 20
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  log_interval: 20
  early_stopping_patience: 5

